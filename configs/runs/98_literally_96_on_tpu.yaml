# Stage 5: VAE fine-tuning with KL regularization
# Unfreeze everything and fine-tune with low beta
#
# Start from Stage 4 checkpoint

inherit: default_512
name: "98_like_96_on_tpu"

data:
  # TPU v4-8 has 8 cores - use large batch to saturate them
  # Start with 128 per core × 8 cores = 1024 global batch size
  # Increase to 2048+ if no OOM, decrease if OOM
  batch_size: 1024
  ds_path: "/home/christian/vae/data_nb_1_combined"
  fixed_length: 256 # Pad all sequences to fixed length for XLA (avoids recompilation)
  num_workers: 4 # Increase if data loading is bottleneck

model:
  latent_dim: 64
  num_queries: 4
  training_mode: "vae"
  # PhraseVAE-style KL: sum over dims, use low beta
  kl_reduction: "per_seq"
  beta_start: 0.0
  beta_end: 0.01 # Low beta like PhraseVAE
  beta_warmup_steps: 200000
  free_bits: 8 # Total free bits budget per sequence
  # Scale LR with batch size: 0.0001 * (1024/256) = 0.0004
  learning_rate: 0.0004
  steps_per_epoch_est: 42690 # 170761 / 4 (4x batch size)
  # XLA/TPU optimizations
  xla_mode: true
  skip_ar_eval: true

trainer:
  max_epochs: 8
  devices: "auto"
  accelerator: "tpu"
  # Use bf16 for TPU - native support, 2x faster than fp32
  precision: "bf16-true"
  # Reduce logging frequency to minimize syncs
  log_every_n_steps: 50

staged_training:
  enabled: true
  new_latent_dim: 64
  source_run_id: 90
  training_mode: "vae"
  freeze_encoder: false # Unfreeze everything
  freeze_decoder: false
  kl_reduction: "per_seq"
  beta_start: 0.0
  beta_end: 0.01
  beta_warmup_steps: 200000
  free_bits: 8
  learning_rate: 0.0001
