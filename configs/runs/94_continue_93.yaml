# Run 94: Continue training run 93
# No architecture changes, just extended training with same/adjusted hyperparameters

inherit: default_512
name: "94_continue_93"

data:
  ds_path: "/home/christian/vae/data_nb_1_combined"

model:
  latent_dim: 64
  num_queries: 4
  training_mode: "vae"
  kl_reduction: "per_seq"
  beta_start: 0.01 # Start at final beta from run 93 (no warmup needed)
  beta_end: 0.01
  beta_warmup_steps: 0 # Already warmed up
  # 8 free bits = 0.125 nats/dim, tighter than 16 but not extreme
  # Adjust based on run 93's final KL - if KL is very low, increase; if high, decrease
  free_bits: 8
  learning_rate: 0.00005 # Lower than 93 for continued fine-tuning

trainer:
  max_epochs: 3

staged_training:
  enabled: true
  source_run_id: 93
  # No architecture changes - just continue training
  training_mode: "vae"
  kl_reduction: "per_seq"
  beta_start: 0.01
  beta_end: 0.01
  beta_warmup_steps: 0
  free_bits: 8
  learning_rate: 0.00003
