# Alternative approach: Train multi-query model from scratch as AE first
# This avoids staged loading complexity for initial experiments

inherit: default_512
name: "77_multiquery_256_ae"

data:
  ds_path: "/home/christian/vae/data_nb_1_rests_combined"

model:
  d_model: 512
  latent_dim: 256  # Smaller latent to start
  num_queries: 4   # Multi-query compression
  training_mode: "ae"  # Pure autoencoder, no KL
  beta_end: 0.0
  free_bits: null
  steps_per_epoch_est: 146455

trainer:
  max_epochs: 3
