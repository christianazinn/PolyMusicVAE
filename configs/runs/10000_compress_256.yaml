# Stage 2: Compress latent space from 512 -> 256
# Freeze encoder, train only the new bottleneck projection
#
# Start from Stage 1 checkpoint

inherit: default_512
name: "staged_2_compress_256"

data:
  ds_path: "/home/christian/vae/data_nb_1_combined"

model:
  latent_dim: 256
  num_queries: 4
  training_mode: "ae"  # Still no KL
  beta_end: 0.0
  free_bits: null

trainer:
  max_epochs: 2

staged_training:
  enabled: true
  source_run_id: "staged_1_ae_multiquery"
  new_latent_dim: 256
  training_mode: "ae"
  freeze_encoder: true  # Freeze encoder + multi-query
  freeze_decoder: false  # Fine-tune decoder
