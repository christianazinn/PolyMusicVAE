# Stage 5: VAE fine-tuning with KL regularization
# Unfreeze everything and fine-tune with low beta
#
# Start from Stage 4 checkpoint

inherit: default_512
name: "93_staged_5a_vae_finetune"

data:
  ds_path: "/home/christian/vae/data_nb_1_combined"

model:
  latent_dim: 64
  num_queries: 4
  training_mode: "vae"
  # PhraseVAE-style KL: sum over dims, use low beta
  kl_reduction: "per_seq"
  beta_start: 0.0
  beta_end: 0.01 # Low beta like PhraseVAE
  beta_warmup_steps: 50000
  free_bits: 16 # Total free bits budget per sequence
  learning_rate: 0.00005 # Lower LR for fine-tuning

trainer:
  max_epochs: 3

staged_training:
  enabled: true
  source_run_id: 90
  training_mode: "vae"
  freeze_encoder: false # Unfreeze everything
  freeze_decoder: false
  kl_reduction: "per_seq"
  beta_start: 0.0
  beta_end: 0.01
  beta_warmup_steps: 50000
  free_bits: 16
  learning_rate: 0.00005
